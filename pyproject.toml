[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "turnlag"
version = "0.1.0"
description = "Measure perceived turn latency for voice agents from call recordings."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Isaac Balakhani" }]
keywords = ["voice", "latency", "speech", "telephony", "evaluation", "deepgram"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.scripts]
turnlag = "turnlag.cli:main"

[project.urls]
Homepage = "https://github.com/ybalakhane/turnlag"
Issues = "https://github.com/ybalakhane/turnlag/issues"

[tool.setuptools.packages.find]
include = ["turnlag*"]
